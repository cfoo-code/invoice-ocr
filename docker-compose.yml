services:
  finago-ai-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    # Langfuse auth check fails at startup until langfuse-web is up; retry.
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Tracing is off unless set; see README "Observability" (docker-compose.langfuse.yml).
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
    volumes:
      - ./data:/app/data
