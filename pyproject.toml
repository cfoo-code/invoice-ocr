[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finago-ai-copilot"
version = "0.1.0"
description = "Reference B2B Financial & Payroll GenAI Architecture (Finago Ask, Automate, Build)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-ai-slim[openai]>=0.0.24",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "rapidocr-onnxruntime>=1.3.24",
    "pillow>=10.4.0",
    "datasets>=3.0.0",
    "rank-bm25>=0.2.2",
    "pypdf>=6.21.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pre-commit>=4.7.0",
    "ipykernel>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
